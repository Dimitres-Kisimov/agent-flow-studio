# This project is JavaScript (see package.json). The only Python is
# scripts/make_onepager.py, which renders the executive PDF deliverable.
# This config just keeps `ruff` consistent with the rest of the portfolio so a
# lint run here matches everywhere else.
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
